<section aria-labelledby="not-found-title" class="not-found-page">
  <div class="not-found-panel">
    <i aria-hidden="true" class="pi pi-search not-found-icon"></i>
    <p class="not-found-code">404</p>
    <h1 id="not-found-title">{{ 'notFound.title' | translate }}</h1>
    <p class="not-found-message">{{ 'notFound.message' | translate }}</p>
    <a class="btn btn-primary" routerLink="/dashboard">
      {{ 'notFound.backToDashboard' | translate }}
      <i aria-hidden="true" class="pi pi-arrow-right ms-2"></i>
    </a>
  </div>
</section>
