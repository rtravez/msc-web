<section aria-labelledby="forbidden-title" class="forbidden-page">
  <div class="forbidden-panel">
    <i aria-hidden="true" class="pi pi-lock forbidden-icon"></i>
    <p class="forbidden-code">403</p>
    <h1 id="forbidden-title">{{ 'forbidden.title' | translate }}</h1>
    <p class="forbidden-message">{{ 'forbidden.message' | translate }}</p>
    <a class="btn btn-primary" routerLink="/dashboard">
      {{ 'forbidden.backToDashboard' | translate }}
      <i aria-hidden="true" class="pi pi-arrow-right ms-2"></i>
    </a>
  </div>
</section>
