<aside
  [attr.aria-label]="'accessibility.sidebarNavigation' | translate"
  [class.sidebar-collapsed]="!open"
  class="app-sidebar"
>
  <div class="sidebar-inner">
    <p class="sidebar-label">
      {{ 'layout.workspace' | translate }}
    </p>
    <nav class="nav flex-column gap-2">
      <a
        (click)="navigate.emit()"
        [routerLinkActiveOptions]="{ exact: true }"
        class="nav-link"
        routerLink="/dashboard"
        routerLinkActive="active"
      >
        <i aria-hidden="true" class="pi pi-home"></i>
        <span>{{ 'dashboard.home' | translate }}</span>
      </a>
      <a
        (click)="navigate.emit()"
        class="nav-link"
        routerLink="/users"
        routerLinkActive="active"
      >
        <i aria-hidden="true" class="pi pi-users"></i>
        <span>{{ 'dashboard.users' | translate }}</span>
      </a>
      <a
        (click)="navigate.emit()"
        class="nav-link"
        routerLink="/accounts"
        routerLinkActive="active"
      >
        <i aria-hidden="true" class="pi pi-wallet"></i>
        <span>{{ 'dashboard.accounts' | translate }}</span>
      </a>
      <a
        (click)="navigate.emit()"
        class="nav-link"
        routerLink="/movements"
        routerLinkActive="active"
      >
        <i aria-hidden="true" class="pi pi-arrow-right-arrow-left"></i>
        <span>{{ 'dashboard.movements' | translate }}</span>
      </a>
    </nav>
  </div>
</aside>
