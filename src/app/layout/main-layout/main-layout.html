<a class="skip-link" href="#main-content">{{ 'accessibility.skipToContent' | translate }}</a>

<div [class.sidebar-is-open]="sidebarOpen" class="app-shell">
  <app-header (toggleSidebar)="toggleSidebar()" [sidebarOpen]="sidebarOpen" />

  <div class="app-body">
    <app-sidebar
      (navigate)="closeSidebar()"
      [class.sidebar-collapsed]="!sidebarOpen"
      [open]="sidebarOpen"
    />
    <button
      (click)="closeSidebar()"
      [attr.aria-label]="'accessibility.closeNavigation' | translate"
      class="sidebar-backdrop"
      type="button"
    ></button>

    <main id="main-content" class="app-content" tabindex="-1">
      <router-outlet />
    </main>
  </div>

  <app-footer />
</div>
