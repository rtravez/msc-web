<div [class.sidebar-is-open]="sidebarOpen" class="app-shell">
  <app-header (toggleSidebar)="toggleSidebar()" />

  <div class="app-body">
    <app-sidebar
      (navigate)="closeSidebar()"
      [class.sidebar-collapsed]="!sidebarOpen"
      [open]="sidebarOpen"
    />
    <button
      (click)="closeSidebar()"
      aria-label="Close navigation"
      class="sidebar-backdrop"
      type="button"
    ></button>

    <main class="app-content">
      <router-outlet />
    </main>
  </div>

  <app-footer />
</div>
