<header class="app-header navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
  <div class="container-fluid px-3 px-lg-4">
    <div class="d-flex align-items-center gap-2">
      <button type="button" class="btn btn-outline-light btn-sm d-lg-none" (click)="toggleSidebar.emit()"
        [attr.aria-label]="'accessibility.toggleSidebar' | translate">
        <i class="pi pi-bars" aria-hidden="true"></i>
      </button>

      <a class="navbar-brand d-flex align-items-center gap-2 fw-bold text-white mb-0" routerLink="/dashboard">
        <span class="brand-mark">MSC</span>
        <span>{{ 'dashboard.brand' | translate }}</span>
      </a>
    </div>

    <div class="header-nav-wrapper d-flex align-items-center gap-2 ms-auto" [class.mobile-open]="mobileMenuOpen">
      <nav class="navbar-nav d-flex align-items-center gap-2 gap-lg-3"
        [attr.aria-label]="'accessibility.mainNavigation' | translate">
        <a class="nav-link px-2 py-2 rounded-2" routerLink="/dashboard" routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }">
          <i class="pi pi-home me-1" aria-hidden="true"></i>
          <span>{{ 'dashboard.home' | translate }}</span>
        </a>
        <a class="nav-link px-2 py-2 rounded-2" routerLink="/users" routerLinkActive="active">
          <i class="pi pi-users me-1" aria-hidden="true"></i>
          <span>{{ 'dashboard.users' | translate }}</span>
        </a>
      </nav>

      <div class="d-flex align-items-center gap-2 ms-lg-3">
        <div class="btn-group btn-group-sm" role="group" [attr.aria-label]="'common.language' | translate">
          <button type="button" class="btn" [class.btn-light]="language.currentLanguage() === 'es'"
            [class.btn-outline-light]="language.currentLanguage() !== 'es'" (click)="setLanguage('es')">
            ES
          </button>
          <button type="button" class="btn" [class.btn-light]="language.currentLanguage() === 'en'"
            [class.btn-outline-light]="language.currentLanguage() !== 'en'" (click)="setLanguage('en')">
            EN
          </button>
        </div>

        <button type="button" class="btn btn-outline-light btn-sm d-flex align-items-center gap-2" (click)="logout()"
          [attr.title]="'dashboard.logout' | translate">
          <i class="pi pi-sign-out" aria-hidden="true"></i>
          <span>{{ 'dashboard.logout' | translate }}</span>
        </button>
      </div>
    </div>

    <button type="button" class="btn btn-outline-light btn-sm d-lg-none ms-2" (click)="toggleMobileMenu()"
      [attr.aria-label]="'accessibility.toggleNavigation' | translate">
      <i class="pi" [class.pi-bars]="!mobileMenuOpen" [class.pi-times]="mobileMenuOpen" aria-hidden="true"></i>
    </button>
  </div>
</header>
