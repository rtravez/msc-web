<header class="app-header navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
  <div class="container-fluid px-3 px-lg-4">
    <a class="navbar-brand d-flex align-items-center gap-2 fw-bold text-white" routerLink="/dashboard">
      <span class="brand-mark">MSC</span>
      <span>{{ 'dashboard.brand' | translate }}</span>
    </a>

    <nav class="navbar-nav ms-auto d-flex align-items-center gap-2 gap-lg-3" aria-label="Main navigation">
      <a class="nav-link px-2 py-2 rounded-2" routerLink="/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
        <i class="pi pi-home me-1" aria-hidden="true"></i>
        <span>{{ 'dashboard.home' | translate }}</span>
      </a>
      <a class="nav-link px-2 py-2 rounded-2" routerLink="/users" routerLinkActive="active">
        <i class="pi pi-users me-1" aria-hidden="true"></i>
        <span>{{ 'dashboard.users' | translate }}</span>
      </a>
    </nav>

    <div class="d-flex align-items-center gap-2 ms-3">
      <div class="btn-group btn-group-sm" role="group" [attr.aria-label]="'common.language' | translate">
        <button type="button" class="btn" [class.btn-light]="language.currentLanguage() === 'es'" [class.btn-outline-light]="language.currentLanguage() !== 'es'" (click)="setLanguage('es')">
          ES
        </button>
        <button type="button" class="btn" [class.btn-light]="language.currentLanguage() === 'en'" [class.btn-outline-light]="language.currentLanguage() !== 'en'" (click)="setLanguage('en')">
          EN
        </button>
      </div>

      <button type="button" class="btn btn-outline-light btn-sm d-flex align-items-center gap-2" (click)="logout()" [attr.title]="'dashboard.logout' | translate">
        <i class="pi pi-sign-out" aria-hidden="true"></i>
        <span>{{ 'dashboard.logout' | translate }}</span>
      </button>
    </div>
  </div>
</header>
