<header class="app-header navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
  <div class="container-fluid px-3 px-lg-4">
    <div class="d-flex align-items-center gap-2">
      <button (click)="toggleSidebar.emit()" [attr.aria-label]="'accessibility.toggleSidebar' | translate" class="btn btn-outline-light btn-sm d-lg-none"
              type="button">
        <i aria-hidden="true" class="pi pi-bars"></i>
      </button>

      <a class="navbar-brand d-flex align-items-center gap-2 fw-bold text-white mb-0" routerLink="/dashboard">
        <span class="brand-mark">MSC</span>
        <span>{{ 'dashboard.brand' | translate }}</span>
      </a>
    </div>

    <div [class.mobile-open]="mobileMenuOpen" class="header-nav-wrapper d-flex align-items-center gap-2 ms-auto">
      <div class="d-flex align-items-center gap-2 ms-lg-3">
        <div [attr.aria-label]="'common.language' | translate" class="btn-group btn-group-sm" role="group">
          <button (click)="setLanguage('es')" [class.btn-light]="language.currentLanguage() === 'es'" [class.btn-outline-light]="language.currentLanguage() !== 'es'"
                  class="btn" type="button">
            ES
          </button>
          <button (click)="setLanguage('en')" [class.btn-light]="language.currentLanguage() === 'en'" [class.btn-outline-light]="language.currentLanguage() !== 'en'"
                  class="btn" type="button">
            EN
          </button>
        </div>

        <button (click)="logout()" [attr.title]="'dashboard.logout' | translate" class="btn btn-outline-light btn-sm d-flex align-items-center gap-2"
                type="button">
          <i aria-hidden="true" class="pi pi-sign-out"></i>
          <span>{{ 'dashboard.logout' | translate }}</span>
        </button>
      </div>
    </div>

    <button (click)="toggleMobileMenu()" [attr.aria-label]="'accessibility.toggleNavigation' | translate" class="btn btn-outline-light btn-sm d-lg-none ms-2"
            type="button">
      <i [class.pi-bars]="!mobileMenuOpen" [class.pi-times]="mobileMenuOpen" aria-hidden="true" class="pi"></i>
    </button>
  </div>
</header>
