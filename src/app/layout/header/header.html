<header class="app-header">
  <div class="header-inner">
    <div class="d-flex align-items-center gap-2">
      <button
        (click)="toggleSidebar.emit()"
        [attr.aria-controls]="'sidebar-navigation'"
        [attr.aria-expanded]="sidebarOpen"
        [attr.aria-label]="'accessibility.toggleSidebar' | translate"
        class="icon-button menu-button"
        id="sidebar-toggle"
        type="button"
      >
        <i aria-hidden="true" class="pi pi-bars"></i>
      </button>

      <a class="navbar-brand d-flex align-items-center gap-2 mb-0" routerLink="/dashboard">
        <span class="brand-mark">MSC</span>
        <span class="brand-name">{{ 'dashboard.brand' | translate }}</span>
      </a>
    </div>

    <div
      [class.mobile-open]="mobileMenuOpen"
      class="header-nav-wrapper d-flex align-items-center gap-2 ms-auto"
      id="header-nav-wrapper"
    >
      <div class="d-flex align-items-center gap-2 ms-lg-3">
        @if (user(); as currentUser) {
          <div [attr.aria-label]="currentUser.name" class="user-profile">
            <span aria-hidden="true" class="user-avatar">{{ currentUser.name.charAt(0) }}</span>
            <span class="user-details">
              <strong>{{ currentUser.name }}</strong>
              <small>{{ currentUser.username }}</small>
            </span>
          </div>
        }

        <fieldset
          [attr.aria-label]="'common.language' | translate"
          class="language-switcher"
          role="group"
        >
          <button
            (click)="setLanguage('es')"
            [class.active]="language.currentLanguage() === 'es'"
            class="language-button"
            type="button"
          >
            ES
          </button>
          <button
            (click)="setLanguage('en')"
            [class.active]="language.currentLanguage() === 'en'"
            class="language-button"
            type="button"
          >
            EN
          </button>
        </fieldset>

        <button
          (click)="logout()"
          [attr.title]="'dashboard.logout' | translate"
          class="logout-button d-flex align-items-center gap-2"
          type="button"
        >
          <i aria-hidden="true" class="pi pi-sign-out"></i>
          <span>{{ 'dashboard.logout' | translate }}</span>
        </button>
      </div>
    </div>

    <button
      (click)="toggleMobileMenu()"
      [attr.aria-controls]="'header-nav-wrapper'"
      [attr.aria-expanded]="mobileMenuOpen"
      [attr.aria-label]="'accessibility.toggleNavigation' | translate"
      class="icon-button mobile-toggle d-lg-none ms-2"
      type="button"
    >
      <i
        [class.pi-bars]="!mobileMenuOpen"
        [class.pi-times]="mobileMenuOpen"
        aria-hidden="true"
        class="pi"
      ></i>
    </button>
  </div>
</header>
